name: Deploy staging preview

on:
  push:
    branches:
      - qa/mobile-performance-v1
    paths:
      - 'template/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

concurrency:
  group: ellipse-staging-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to n.horecagroup.sk
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy template to staging
        shell: bash
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_TEMPLATE_PATH: ${{ secrets.STAGING_TEMPLATE_PATH }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          PORT="${SSH_PORT:-22}"
          TARGET="${STAGING_TEMPLATE_PATH:-/var/www/vhosts/horecagroup.sk/n.horecagroup.sk/template/}"

          rsync -az --delete-delay \
            --exclude 'ellipse/video/manager-dashboard.mp4' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $PORT" \
            template/ "$SSH_USER@$SSH_HOST:$TARGET"

      - name: Verify staging homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 3 \
            https://n.horecagroup.sk/ >/dev/null
